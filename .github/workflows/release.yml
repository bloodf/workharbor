name: Package preview release
on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release version and notes
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          [[ "$RELEASE_TAG" == "v$VERSION" ]] || { echo 'Tag must match Info.plist version'; exit 1; }
          test -s "docs/releases/$VERSION.md"
      - name: Test
        run: WORKHARBOR_BUILD_ROOT="$RUNNER_TEMP/workharbor-release" ./scripts/test.sh
      - name: Build
        run: WORKHARBOR_BUILD_ROOT="$RUNNER_TEMP/workharbor-release" ./scripts/build-app.sh
      - name: Package and verify app ZIP
        shell: bash
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          ARCH=$(uname -m)
          [[ "$ARCH" == arm64 ]] || { echo 'Apple Silicon runner required for this release'; exit 1; }
          mkdir -p release "$RUNNER_TEMP/zip-verification"
          ASSET="WorkHarbor-$VERSION-macos-$ARCH.zip"
          cp dist/WorkHarbor.zip "release/$ASSET"
          ditto -x -k "release/$ASSET" "$RUNNER_TEMP/zip-verification"
          codesign --verify --deep --strict "$RUNNER_TEMP/zip-verification/WorkHarbor.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/zip-verification/WorkHarbor.app/Contents/Info.plist")" = "$VERSION"
          (cd release && shasum -a 256 "$ASSET" > "$ASSET.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: WorkHarbor-release-ZIP
          path: release/*
          if-no-files-found: error
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          gh release create "$RELEASE_TAG" release/*.zip release/*.sha256 --verify-tag --prerelease --title "WorkHarbor $VERSION" --notes-file "docs/releases/$VERSION.md"
