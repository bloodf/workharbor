name: Test and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Swift version
        run: swift --version
      - name: Unit tests
        run: ./scripts/test.sh
      - name: Build app
        run: ./scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: WorkHarbor-test-build
          path: dist/WorkHarbor.zip
          if-no-files-found: error
          retention-days: 7
